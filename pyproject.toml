[project]
name = "my-ds-project"
version = "0.1.0"
description = "DS project with strict checks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

# --- Настройки Ruff (Линтер и форматтер) ---
[tool.ruff]
line-length = 99
target-version = "py312"
exclude = [".venv", "__pycache__", ".git", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

# --- Настройки mypy (Тайпчекер) ---
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = '(^|/)(__pycache__|\.venv|build|dist)/'

[[tool.mypy.overrides]]
module = ["my_ds_project.*"]
disallow_untyped_defs = true