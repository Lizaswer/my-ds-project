services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.7
    container_name: rustfs-server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - MLFLOW_S3_ENDPOINT_URL=http://rustfs:9000
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_IGNORE_TLS=true
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  create-bucket:
    image: pgsty/minio:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for RustFS...';
      until /usr/bin/mcli alias set myrustfs http://rustfs:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do
        sleep 1;
      done;
      echo 'Creating bucket...';
      /usr/bin/mcli mb --ignore-existing myrustfs/$$S3_BUCKET;
      echo 'Bucket created successfully.';
      "

  # --- Блок 1: MLflow (ДЗ №3) ---
  postgres:
    image: postgres:15.6-alpine
    container_name: mlflow-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-mlflow-bucket:
    image: pgsty/minio:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - MLFLOW_BUCKET=mlflow
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for RustFS...';
      until /usr/bin/mcli alias set myrustfs http://rustfs:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do
        sleep 1;
      done;
      echo 'Creating MLflow bucket...';
      /usr/bin/mcli mb --ignore-existing myrustfs/$$MLFLOW_BUCKET;
      echo 'MLflow bucket created successfully.';
      "

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: mlflow-server
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      create-mlflow-bucket:
        condition: service_completed_successfully
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_IGNORE_TLS=true
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow:5000,localhost:*,127.0.0.1:*
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://mlflow/
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- Блок 4: Обучение в контейнере (ДЗ №3) ---
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: unknown
    container_name: trainer
    depends_on:
      rustfs:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - MLFLOW_S3_ENDPOINT_URL=http://rustfs:9000
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_IGNORE_TLS=true
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs

volumes:
  rustfs_data:
  postgres_data:
